name: News Bot

on:
  workflow_dispatch: {}
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: write

concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install ffmpeg and Arabic fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-noto-ui-core
          fc-cache -fv

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run news bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID:        ${{ secrets.CHAT_ID }}
          GEMINI_KEY:     ${{ secrets.GEMINI_KEY }}
        run: python news_bot.py

      - name: Commit seen state
        run: |
          git config user.name "news-bot"
          git config user.email "bot@noreply.local"
          if [ -n "$(git status --porcelain news_seen.json)" ]; then
            git add news_seen.json
            git commit -m "update seen state"
            for i in 1 2 3; do
              if git push; then
                echo "✅ Pushed successfully"
                exit 0
              fi
              echo "⚠️ Push rejected (attempt $i), rebasing..."
              # إلغاء أي rebase عالق
              git rebase --abort 2>/dev/null || true
              # سحب التغييرات مع الأولوية لملفنا عند التعارض
              git pull --rebase -X theirs origin main || {
                # لو فشل الـ rebase، نعيد البناء من الريموت
                git rebase --abort 2>/dev/null || true
                git fetch origin main
                git reset --hard origin/main
                git checkout HEAD -- news_seen.json 2>/dev/null || true
                cp news_seen.json /tmp/seen_backup.json 2>/dev/null || true
                python3 -c "
import json
local = json.load(open('/tmp/seen_backup.json')) if __import__('os').path.exists('/tmp/seen_backup.json') else {}
print('Merged seen state')
" || true
                git add news_seen.json
                git commit -m "update seen state" || true
              }
            done
            echo "⚠️ Push failed, state will be saved next run"
            exit 0
          fi
