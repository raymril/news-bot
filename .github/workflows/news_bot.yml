name: News Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run news bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID:        ${{ secrets.CHAT_ID }}
          GEMINI_KEY:     ${{ secrets.GEMINI_KEY }}
        run: python news_bot.py

      - name: Commit seen state
        if: always()
        run: |
          git config user.name "news-bot"
          git config user.email "bot@noreply.local"
          if [ -n "$(git status --porcelain news_seen.json)" ]; then
            git add news_seen.json
            git commit -m "update seen state"
            for i in 1 2 3; do
              if git push; then
                echo "Pushed successfully"
                exit 0
              fi
              echo "Push rejected (attempt $i), rebasing..."
              git rebase --abort 2>/dev/null || true
              git pull --rebase -X theirs origin main || {
                git rebase --abort 2>/dev/null || true
                git fetch origin main
                git reset --hard origin/main
                git add news_seen.json 2>/dev/null || true
                git commit -m "update seen state" 2>/dev/null || true
              }
            done
            echo "Push failed, state will be saved next run"
            exit 0
          fi
