name: Test Video Translation

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'رابط فيديو مباشر (.mp4)'
        required: true
        type: string
      leader_name:
        description: 'اسم القائد أو وصف الفيديو'
        required: false
        default: 'فيديو تجريبي'
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install ffmpeg and Arabic font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-ui-core
          fc-cache -fv
          ffmpeg -version | head -1

      - run: |
          pip install -r requirements.txt
          pip install yt-dlp

      - name: Run test
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID:        ${{ secrets.CHAT_ID }}
          GEMINI_KEY:     ${{ secrets.GEMINI_KEY }}
          VIDEO_URL:      ${{ inputs.video_url }}
          LEADER_NAME:    ${{ inputs.leader_name }}
        run: python test_video.py
